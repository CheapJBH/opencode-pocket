name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform and build tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Fetch bundled runtime (built into APK, no download on device)
        run: |
          mkdir -p app/src/main/assets
          curl -sSL -o app/src/main/assets/runtime.pkg.tar.xz "https://github.com/Hope2333/opencode-termux/releases/download/Push261005/opencode-2.0.22-1-aarch64.pkg.tar.xz"
          echo "9830eb45f64b5caa1b797c6a399eab29a528a4ba3273cc4ad4430700cd877cbf  app/src/main/assets/runtime.pkg.tar.xz" | sha256sum -c -
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-pocket-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
